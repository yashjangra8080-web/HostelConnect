version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hostelconnect-mysql-prod
    command: >
      mysqld
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --event-scheduler=ON
      --default-time-zone=+05:30
      --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided}
      MYSQL_DATABASE: ${DB_NAME:-hostelconnect}
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hostelconnect-net

  api:
    build:
      context: .
      dockerfile: server/Dockerfile.prod
    container_name: hostelconnect-api-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided}
      DB_NAME: ${DB_NAME:-hostelconnect}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be provided}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hostelconnect-net

  proxy:
    build:
      context: .
      dockerfile: web/Dockerfile.prod
    container_name: hostelconnect-proxy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - hostelconnect-net

networks:
  hostelconnect-net:
    driver: bridge

volumes:
  mysql_prod_data:
